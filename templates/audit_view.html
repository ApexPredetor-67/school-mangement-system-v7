<!doctype html><html><head><meta charset="utf-8"><title>Private Audit Log</title><link rel="stylesheet" href="{{url_for('static',filename='app.css')}}"></head><body><div class="wrap"><div class="hero"><h1>Private Audit Log</h1><p class="muted">Read-only. Restricted by independent credentials and IP allowlist.</p></div><div class="card" style="margin-top:16px"><table><tr><th>Time</th><th>Actor</th><th>Role</th><th>Action</th><th>Target</th><th>IP</th><th>Hash</th></tr>{% for e in events %}<tr><td>{{e.occurred_at}}</td><td>{{e.actor_username}}</td><td>{{e.actor_role}}</td><td>{{e.action}}</td><td>{{e.target_type}} {{e.target_id}}</td><td>{{e.ip_address}}</td><td class="small">{{e.event_hash[:12]}}…</td></tr>{% endfor %}</table></div></div></body></html>
