{% extends 'base.html' %}{% block title %}Edit Class Teacher{% endblock %}{% block header %}Edit Class Teacher{% endblock %}{% block content %}<div class="hero"><div class="eyebrow">Administration</div><h1>Edit Class Teacher</h1></div><div class="card" style="margin-top:18px;max-width:800px"><form method="post"><div class="grid grid3"><div class="field"><label>Teacher</label><select name="teacher_id">{% for t in teachers %}<option value="{{t.id}}" {{'selected' if t.id==assignment.teacher_id else ''}}>{{t.name}}</option>{% endfor %}</select></div><div class="field"><label>Class</label><select name="class_name">{% for c in class_options %}<option value="{{c}}" {{'selected' if c==assignment.class_name else ''}}>{{c}}</option>{% endfor %}</select></div><div class="field"><label>Section</label><input name="section" value="{{assignment.section}}"></div></div><div class="actions" style="margin-top:14px"><button class="btn btn-primary">Save</button><a class="btn btn-light" href="{{url_for('assignments')}}">Cancel</a></div></form></div>{% endblock %}
