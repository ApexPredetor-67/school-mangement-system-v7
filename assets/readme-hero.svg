<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">DAV PS KKP School Management System</title>
  <desc id="desc">Animated header graphic for the project README.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.52" stop-color="#173b73"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".2"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".65"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <circle cx="1030" cy="70" r="150" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="r" values="130;175;130" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="310" r="130" fill="#38bdf8" opacity=".08">
    <animate attributeName="cy" values="310;285;310" dur="5s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(74 72)" filter="url(#shadow)">
    <rect width="196" height="196" rx="42" fill="#ffffff" opacity=".97"/>
    <circle cx="98" cy="83" r="45" fill="#2563eb" opacity=".12"/>
    <path d="M98 54c-18 0-32 14-32 32 0 12 6 22 16 28l-12 28c-2 7 3 14 10 14h36c7 0 12-7 10-14l-12-28c10-6 16-16 16-28 0-18-14-32-32-32Z" fill="#2563eb"/>
    <circle cx="82" cy="82" r="7" fill="#ffffff"/>
    <circle cx="114" cy="82" r="7" fill="#ffffff"/>
    <path d="M80 103c10 9 26 9 36 0" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <rect x="54" y="132" width="88" height="10" rx="5" fill="#dbeafe"/>
    <rect x="70" y="150" width="56" height="8" rx="4" fill="#bfdbfe"/>
    <circle cx="160" cy="34" r="18" fill="#22c55e"/>
    <path d="M151 34l6 6 11-13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="320" y="116" font-size="44" font-weight="800">DAV PS KKP</text>
    <text x="320" y="163" font-size="28" font-weight="700" opacity=".92">School Management + AI</text>
    <text x="320" y="203" font-size="18" opacity=".72">Face attendance • academics • results • report cards • portals</text>
  </g>

  <g transform="translate(320 238)">
    <g>
      <rect width="142" height="42" rx="21" fill="#ffffff" opacity=".11" stroke="#ffffff" stroke-opacity=".22"/>
      <text x="71" y="27" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700">RENDER READY</text>
    </g>
    <g transform="translate(154 0)">
      <rect width="142" height="42" rx="21" fill="#ffffff" opacity=".11" stroke="#ffffff" stroke-opacity=".22"/>
      <text x="71" y="27" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700">SUPABASE</text>
    </g>
    <g transform="translate(308 0)">
      <rect width="142" height="42" rx="21" fill="#ffffff" opacity=".11" stroke="#ffffff" stroke-opacity=".22"/>
      <text x="71" y="27" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700">AI READY</text>
    </g>
  </g>

  <path d="M980 266c35-55 75-72 128-58" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 12">
    <animate attributeName="stroke-dashoffset" from="0" to="-38" dur="1.8s" repeatCount="indefinite"/>
  </path>
</svg>
